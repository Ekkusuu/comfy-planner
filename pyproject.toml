[project]
name = "comfy-planner"
version = "0.1.0"
description = "Local planner and queue for ComfyUI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "pillow>=13.0.0",
    "tomlkit>=0.15.2",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60                 # a hung test fails instead of blocking the run

[tool.setuptools]
packages = []
