# Content rules: the fixed filter that checks every description, prompt, scene plan and offered entry.
#
# This file belongs to the app: it is read once at startup and it is not a setting (app/planning/content_safety.py). When it is missing
# or cannot be read, the app runs with no rules and logs a warning. English only.
#
# A rule blocks a text when every group of its `all_of` list matches. A group matches when any entry of its `words` matches as a whole
# word (case ignored; an entry is a plain word or a regular-expression fragment), or when its named `check` says so. The code applies
# the same weight and bracket handling to every rule before matching, so a rule needs no variants for it.
#
#   code         short name of the rule; the log and the stored issue carry it, never the matched text
#   message      the one fixed sentence shown for the rule everywhere (card, plan, queue)
#   all_of       the groups; all of them must match
#   words        the entries of a group
#   check        optional: a named function in content_safety.py for what a word list cannot say
#   avoid_alone  optional: an entry or a scene plan that matches this group alone is also blocked or left out
#   old_codes    optional: issue codes that earlier versions stored for the rule; jobs that still hold them are treated like the rule's own
#
# Adding a filter: append a [[rule]] with a new code, a message and its groups. No code change is needed. Run the tests afterwards.
# Each rule is loaded and self-tested on its own: a broken rule is skipped with a warning in the log, and the other rules stay active.
#
# Example (commented out, so it is not read; remove the leading "# " to use it). It blocks a text that matches both groups:
#
# [[rule]]
# code = 'example'
# message = 'Blocked: this content is not allowed. Change the description or the prompts.'
#
# [[rule.all_of]]
# name = 'first'
# words = ['placeholder', 'another placeholder', 'placeholders?', 'placehold\w*']
#
# [[rule.all_of]]
# name = 'second'
# avoid_alone = false
# words = ['sample', 'samples']
